name: Release

on:
  push:
    branches: ['**']

permissions:
  contents: write

# GitHub queues up to 100 waiting runs. Runs beyond that limit are rejected.
concurrency:
  group: quota-reset-release
  queue: max

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Change these in source when starting a new release series.
      RELEASE_MAJOR: '0'
      RELEASE_MINOR: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
      - name: Test release helpers and Go code
        run: |
          set -euo pipefail
          python3 scripts/release-ci-test.py
          go test ./...
      - name: Reserve version and tag exact source commit
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python3 scripts/release-ci.py select "$RELEASE_MAJOR" "$RELEASE_MINOR")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify -q "refs/tags/$tag" >/dev/null; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
      - name: Stamp and build Linux asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release-ci.py stamp "$VERSION"
          mkdir -p release-stage release-assets
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildvcs=false -buildmode=c-shared -trimpath -ldflags='-s -w' -o release-stage/quota-reset.so .
          # Strip file timestamps and zip metadata so retries can compare bytes.
          touch -t 198001010000 release-stage/quota-reset.so
          (cd release-stage && zip -X -q "../release-assets/quota-reset_${VERSION}_linux_amd64.zip" quota-reset.so)
          (cd release-assets && sha256sum "quota-reset_${VERSION}_linux_amd64.zip" > checksums.txt && sha256sum -c checksums.txt)
          unzip -t "release-assets/quota-reset_${VERSION}_linux_amd64.zip"
      - name: Publish verified release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Re-read the remote ref before using an existing or newly created release.
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          test "$remote_sha" = "$GITHUB_SHA"
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft-state"; then
            draft=$(<"$RUNNER_TEMP/draft-state")
          else
            # Fail closed if querying an existing release failed for a reason other
            # than absence: create itself cannot overwrite an existing release.
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
            draft=true
          fi
          if [ "$draft" = true ]; then
            gh release upload "$TAG" "release-assets/quota-reset_${VERSION}_linux_amd64.zip" release-assets/checksums.txt --clobber
          fi
          mkdir -p "$RUNNER_TEMP/verified-assets"
          gh release download "$TAG" --pattern "quota-reset_${VERSION}_linux_amd64.zip" --pattern checksums.txt --dir "$RUNNER_TEMP/verified-assets"
          (cd "$RUNNER_TEMP/verified-assets" && test "$(wc -l < checksums.txt)" -eq 1 && grep -Fx "$(sha256sum "quota-reset_${VERSION}_linux_amd64.zip")" checksums.txt && sha256sum -c checksums.txt && unzip -t "quota-reset_${VERSION}_linux_amd64.zip")
          # Also check published releases on retry: a self-consistent but replaced
          # zip/checksum pair must not authorize a registry update.
          python3 scripts/release-ci.py verify-checksums release-assets/checksums.txt "$RUNNER_TEMP/verified-assets/checksums.txt"
          if [ "$draft" = true ]; then
            gh release edit "$TAG" --draft=false
          fi
      - name: Advance default-branch registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release-ci.py registry "$VERSION"
